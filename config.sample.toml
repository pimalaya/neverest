# ================================================================================
# `neverest` configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/neverest/config.toml
#   - $HOME/.config/neverest/config.toml
#   - $HOME/.neverestrc
#
# Override with `neverest -c <PATH>` or `NEVEREST_CONFIG=<PATH>`. Multiple paths
# can be passed at once, separated by `:`; the first one is the base and the
# rest are deep-merged on top of it.
#
# Run bare `neverest` (no subcommand) to launch the wizard: it discovers a
# provider from your email address, tests it, and writes a one-side account
# here. A `right` side (remote-to-remote mirror) is added by hand.
#
# A side is always a REMOTE. The local replica is the pimdir store itself: one
# side syncs that remote against the store, two sides mirror one remote onto
# the other through it.
# ================================================================================

[accounts.example]

# Use this account when `-a/--account` is not passed.
default = true

# --------------------------------------------------------------------------------
# Collection sync filters
# --------------------------------------------------------------------------------

# Applied symmetrically to both sides. Pick exactly one variant; omit for `all`.
collection.filter = "all"
#collection.filter.include = ["INBOX", "Sent"]
#collection.filter.exclude = ["[Gmail]/All Mail", "Trash"]

# --------------------------------------------------------------------------------
# Per-side overview
# --------------------------------------------------------------------------------
#
# Each side picks exactly one backend: `<side>.imap.*`, `<side>.jmap.*`,
# `<side>.gmail.*` or `<side>.msgraph.*`. Permissions and pool size live inside
# that backend table:
#   - `collection.{create,delete}`, `flag.update`, `item.update`: default true
#   - `item.{create,delete}`: both required when the block is declared
#   - `pool-size`: default 8 (IMAP), 4 (JMAP, Gmail, Graph)
#
# `item.update` gates in-place body edits, so it is inert for mail (immutable
# bodies) and meaningful for CardDAV and CalDAV.

# --------------------------------------------------------------------------------
# IMAP config
# https://www.iana.org/go/rfc9051
# --------------------------------------------------------------------------------

# Bare authority (implicit `imaps://`), or a full `imap://` / `imaps://` URL.
left.imap.server = "imap.fastmail.com"
#left.imap.server = "imap.example.com:143"
#left.imap.server = "imap://example.com:143"
#left.imap.server = "imaps://example.com:993"

# TLS and crypto providers, defaulting to the first available at runtime.
#left.imap.tls.provider = "rustls"
#left.imap.tls.provider = "native-tls"
#left.imap.tls.rustls.crypto = "ring"
#left.imap.tls.rustls.crypto = "aws"

# Extra root certificate, PEM-encoded.
#left.imap.tls.cert = "/path/to/custom/cert.pem"

# Upgrade a cleartext `imap://` connection.
#left.imap.starttls = false

# Offered during the TLS handshake (rustls only). Defaults to ["imap"], `[]`
# skips ALPN.
#left.imap.alpn = ["imap"]
#left.imap.alpn = []

# Pick exactly one SASL mechanism. Omit the whole `sasl` table to skip
# authentication (no `AUTHENTICATE` command sent).

# ANONYMOUS: https://datatracker.ietf.org/doc/html/rfc4505
#left.imap.sasl.anonymous.message = "neverest"

# PLAIN: https://datatracker.ietf.org/doc/html/rfc4616
left.imap.sasl.plain.username = "pimalaya@fastmail.org"
left.imap.sasl.plain.password.command = ["pass", "show", "pimalaya/fastmail-imap-pop-smtp"]
#left.imap.sasl.plain.password.command = "pass show example"

# LOGIN: https://datatracker.ietf.org/doc/html/draft-murchison-sasl-login-00
#left.imap.sasl.login.username = "user@example.com"
#left.imap.sasl.login.password.raw = "***"

# OAUTHBEARER (GS2 host and port derived from the server URL):
# https://datatracker.ietf.org/doc/html/rfc7628
#left.imap.sasl.oauthbearer.username = "user@example.com"
#left.imap.sasl.oauthbearer.token.raw = "***"
#left.imap.sasl.oauthbearer.token.command = ["ortie", "token", "read", "example"]

# XOAUTH2: https://developers.google.com/gmail/imap/xoauth2-protocol
#left.imap.sasl.xoauth2.username = "user@example.com"
#left.imap.sasl.xoauth2.token.raw = "***"

# SCRAM-SHA-256: https://datatracker.ietf.org/doc/html/rfc7677
#left.imap.sasl.scram-sha-256.username = "user@example.com"
#left.imap.sasl.scram-sha-256.password.raw = "***"

# Keep the server read-mostly, so a buggy sync cannot destroy its state.
left.imap.collection.create = false
left.imap.collection.delete = false
left.imap.item.create = true
left.imap.item.delete = false

# Narrow the pool when the server's `LIMIT` advertises less than 8.
#left.imap.pool-size = 8

# --------------------------------------------------------------------------------
# JMAP config (alternative to the IMAP block above)
# https://www.iana.org/go/rfc8620
# https://www.iana.org/go/rfc8621
# --------------------------------------------------------------------------------

# Bare authority (discovered through `GET /.well-known/jmap`) or session URL.
#right.jmap.server = "fastmail.com"
#right.jmap.server = "https://api.fastmail.com/jmap/session"

# TLS mirrors the imap.tls block above. ALPN defaults to ["http/1.1"].
#right.jmap.tls.provider = "rustls"
#right.jmap.tls.rustls.crypto = "ring"
#right.jmap.tls.cert = "/path/to/custom/cert.pem"
#right.jmap.alpn = ["http/1.1"]
#right.jmap.alpn = []

# Pick exactly one of `header`, `bearer`, `basic`.
#right.jmap.auth.header.raw = "Bearer eyJhbGciOiJ..."
#right.jmap.auth.header.command = "pass show fastmail-token"
#right.jmap.auth.bearer.token.raw = "***"
#right.jmap.auth.bearer.token.command = ["ortie", "access-token", "read", "fastmail-api"]
#right.jmap.auth.basic.username = "user@example.com"
#right.jmap.auth.basic.password.raw = "***"
#right.jmap.auth.basic.password.command = "pass show fastmail"

#right.jmap.pool-size = 4

# --------------------------------------------------------------------------------
# Gmail config (alternative to the IMAP / JMAP blocks above)
# https://developers.google.com/gmail/api
# --------------------------------------------------------------------------------

# Labels are exposed as collections; the API host is fixed, so only the owner,
# TLS and the credential are configurable.
#right.gmail.user-id = "me"
#right.gmail.tls.provider = "rustls"
#right.gmail.tls.rustls.crypto = "ring"
#right.gmail.tls.cert = "/path/to/custom/cert.pem"
#right.gmail.alpn = ["http/1.1"]
#right.gmail.alpn = []

# Bearer tokens only. Refreshing one is the command's job, typically ortie.
#right.gmail.auth.token.raw = "***"
#right.gmail.auth.token.command = ["ortie", "access-token", "read", "gmail"]

#right.gmail.item.create = true
#right.gmail.item.delete = false
#right.gmail.pool-size = 4

# --------------------------------------------------------------------------------
# Microsoft Graph config (alternative to the blocks above)
# https://learn.microsoft.com/en-us/graph/api/resources/mail-api-overview
# --------------------------------------------------------------------------------

# Mail folders are exposed as collections; the API host is fixed, so only the
# owner, TLS and the credential are configurable.
#right.msgraph.user-id = "me"
#right.msgraph.tls.provider = "rustls"
#right.msgraph.tls.rustls.crypto = "ring"
#right.msgraph.tls.cert = "/path/to/custom/cert.pem"
#right.msgraph.alpn = ["http/1.1"]
#right.msgraph.alpn = []

# Bearer tokens only: neverest runs no OAuth flow. The command runs once per
# opened connection, typically ortie serving a cached, auto-refreshed token.
#right.msgraph.auth.token.raw = "***"
#right.msgraph.auth.token.command = ["ortie", "-a", "msgraph", "token", "show", "--auto-refresh"]

# NOTE: Graph pushes flags and deletes only; appends and moves are rejected
# whatever the permissions say.
#right.msgraph.item.create = true
#right.msgraph.item.delete = false
#right.msgraph.pool-size = 4

# --------------------------------------------------------------------------------
# CardDAV config (contacts, not mail)
# https://www.iana.org/go/rfc6352
# --------------------------------------------------------------------------------

# A CardDAV side syncs **contacts**, so it pairs with another contacts side or
# with the store alone, never with a mailbox: an account's two sides must agree
# on their kind. Requires the `carddav` cargo feature, which is not in the
# default set until the backend has a live suite behind it.
#
# The URL is the entry point only; the principal and the address book home set
# are discovered from it, and each address book becomes a collection keyed by
# its path segment.
#left.carddav.server = "https://dav.example.org/"

# Pick exactly one of `basic` (the common case) or `bearer`.
#left.carddav.auth.basic.username = "user"
#left.carddav.auth.basic.password.command = ["pass", "show", "example/dav"]
#left.carddav.auth.bearer.token.command = ["ortie", "-a", "dav", "token", "show", "-r"]

# TLS mirrors the imap.tls block above. ALPN defaults to ["http/1.1"].
#left.carddav.tls.provider = "rustls"
#left.carddav.alpn = ["http/1.1"]

# Cards are mutable, unlike mail: `item.update` gates in-place edits here, and
# a conditional write means a card edited on both sides is reported as a
# conflict rather than overwritten.
#left.carddav.item.update = true
#left.carddav.item.create = true
#left.carddav.item.delete = false
#left.carddav.pool-size = 4

# --------------------------------------------------------------------------------
# Store options
# --------------------------------------------------------------------------------

# Where `pimdir.db` and `objects/` live. Defaults to the XDG state directory.
#store.root = "~/.local/state/neverest/example"

# Whether a two-side sync keeps crossing bodies: `relay` (the IMAP to IMAP
# default) streams them through, `retain` keeps them. A one-side sync retains.
#store.retention = "retain"

# How far a two-side retain sync hydrates: `crossing` (default) fetches only
# the bodies about to cross, `full` mirrors every body in. One side is full.
#store.hydration = "full"

# The store never truly deletes: an item whose last binding vanishes (a remote
# expunge) is retained instead, hidden but kept with its body. This is how long
# it stays before a sync reclaims it: one integer plus `s`, `m`, `h`, `d` or
# `w`. UNSET means never purge, `"0"` purges at once (the terminal-delete
# behaviour). `neverest sync --no-purge` skips one run. Inspect and restore
# retained items with the `pimdir` CLI.
#store.purge-after = "90d"

# BACKUP RECIPE: a read-only side plus no purge, so a remote expunge cannot
# lose anything. The expunge still propagates, but the item stays in the store,
# restorable, until you purge on purpose:
#
#   left.imap.item.delete = false
#   left.imap.collection.delete = false
#   # store.purge-after left unset

# --------------------------------------------------------------------------------
# Submission send channel (SMTP)
# --------------------------------------------------------------------------------

# The server a side's queued `submit` intents are sent through at the start of
# every sync. A frontend enqueues one through the store's action queue (a
# `v: 1` payload naming the body blob plus the envelope); there is no reserved
# Outbox collection. The channel belongs to the side it completes: a side
# either sends by itself (Graph, through sendMail) or needs this. When both
# sides offer one, `left` wins.
#
# An SMTP 4xx leaves the intent pending for the next run, a 5xx parks it.
# Sending is at-least-once, so `Message-ID` deduplication is the provider's job.
#
# Omit `login` and `password` together for an unauthenticated relay.
#left.smtp.server = "smtps://smtp.fastmail.com:465"
#left.smtp.server = "smtp://smtp.example.com:587"
#left.smtp.starttls = true
#left.smtp.login = "pimalaya@fastmail.org"
#left.smtp.password.command = ["pass", "show", "pimalaya/fastmail-imap-pop-smtp"]

# Offered during the TLS handshake (rustls only). Defaults to ["smtp"], `[]`
# skips ALPN.
#left.smtp.alpn = ["smtp"]
#left.smtp.alpn = []
