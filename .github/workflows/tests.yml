name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    uses: pimalaya/nix/.github/workflows/tests.yml@master
    secrets: inherit

  live:
    # Only in this repository: a fork holds no secret, and the job would fail on
    # every contributor's push for want of one. One job per provider, so one
    # provider failing (a quota) leaves the other's tests running.
    if: github.repository == 'pimalaya/neverest'
    strategy:
      fail-fast: false
      matrix:
        provider: [google, microsoft]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - uses: Swatinem/rust-cache@v2
      - name: Run the live tests
        if: matrix.provider == 'google'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: nix develop -c cargo test --test google -- --ignored --test-threads 1
      - name: Run the live tests
        if: matrix.provider == 'microsoft'
        env:
          MSGRAPH_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MSGRAPH_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MSGRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: nix develop -c cargo test --test msgraph -- --ignored --test-threads 1

  features:
    # Each backend builds alone, so clippy runs over every feature set a
    # packager may pick, one cache for all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy over every feature set
        run: |
          set -e
          sets=(
            ""
            "--all-features"
            "--no-default-features --features rustls-ring"
            "--no-default-features --features native-tls,imap,smtp"
          )
          for backend in imap smtp dav msgraph gpeople gcal gmail search; do
            sets+=("--no-default-features --features rustls-ring,$backend")
          done
          for set in "${sets[@]}"; do
            echo "::group::clippy $set"
            read -ra flags <<< "$set"
            nix develop -c cargo clippy --locked --all-targets "${flags[@]}" -- -D warnings
            echo "::endgroup::"
          done
      - name: Test a build without the Google backends
        run: nix develop -c cargo test --locked --no-default-features --features rustls-ring,imap,smtp
