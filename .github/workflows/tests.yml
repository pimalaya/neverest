name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    uses: pimalaya/nix/.github/workflows/tests.yml@master
    secrets: inherit

  live-tests:
    # Only in this repository: a fork holds no secret, and the job would fail on
    # every contributor's push for want of one.
    if: github.repository == 'pimalaya/neverest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - uses: Swatinem/rust-cache@v2
      - name: Run the live tests
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MSGRAPH_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MSGRAPH_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MSGRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: nix develop -c cargo test --test google --test msgraph -- --ignored --test-threads 1
