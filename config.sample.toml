# ================================================================================
# `neverest` configuration file.
#
# Loaded from the first valid path among:
#   - $XDG_CONFIG_HOME/neverest/config.toml
#   - $HOME/.config/neverest/config.toml
#   - $HOME/.neverestrc
#
# Override with `neverest -c <PATH>` or `NEVEREST_CONFIG=<PATH>`. Multiple paths
# can be passed at once, separated by `:`; the first one is the base and the
# rest are deep-merged on top of it.
#
# Run bare `neverest` (no subcommand) with no configuration file on disk and it
# offers the wizard, which prints the help otherwise: the wizard discovers a
# provider from your email address, tests it, and writes a one-account,
# one-source configuration here, in the flat spelling below. Everything else on
# this page is written by hand.
#
# An account is one pimdir STORE, fed by one or more named SOURCES, each a
# remote. A backend written directly under the account (`imap.server = …`) is
# sugar for a source named after its protocol; the `sources` table at the bottom
# is what you reach for when you need two of one protocol.
#
# Sources of one kind sharing a `collection.namespace` bind the same hub
# collections, which is what makes them mirror each other. Left on their own
# names they sit side by side in one store and never push to one another.
# ================================================================================

[accounts.example]

# Use this account when `-a/--account` is not passed.
default = true

# --------------------------------------------------------------------------------
# Per-source overview
# --------------------------------------------------------------------------------
#
# Each source picks exactly one backend: `imap.*`, `jmap.*`, `gmail.*`,
# `msgraph.*` or `carddav.*`. Its filter, namespace, permissions and pool size
# live inside that backend table:
#   - `collection.filter`: which collections this source syncs (per source, since
#     an `include = ["INBOX"]` means nothing to a contacts source)
#   - `collection.namespace`: which hub collections it binds into; defaults to
#     the source name, so sources are isolated unless you say otherwise
#   - `collection.{create,delete}`, `flag.update`, `item.update`: default true
#   - `item.{create,delete}`: both required when the block is declared
#   - `pool-size`: default 8 (IMAP), 4 (JMAP, Gmail, Graph)
#
# `item.update` gates in-place body edits, so it is inert for mail (immutable
# bodies) and meaningful for CardDAV and CalDAV.

# Which collections this source syncs. Pick exactly one variant; omit for `all`.
imap.collection.filter = "all"
#imap.collection.filter.include = ["INBOX", "Sent"]
#imap.collection.filter.exclude = ["[Gmail]/All Mail", "Trash"]

# --------------------------------------------------------------------------------
# IMAP config
# https://www.iana.org/go/rfc9051
# --------------------------------------------------------------------------------

# Bare authority (implicit `imaps://`), or a full `imap://` / `imaps://` URL.
imap.server = "imap.fastmail.com"
#imap.server = "imap.example.com:143"
#imap.server = "imap://example.com:143"
#imap.server = "imaps://example.com:993"

# TLS and crypto providers, defaulting to the first available at runtime.
#imap.tls.provider = "rustls"
#imap.tls.provider = "native-tls"
#imap.tls.rustls.crypto = "ring"
#imap.tls.rustls.crypto = "aws"

# Extra root certificate, PEM-encoded.
#imap.tls.cert = "/path/to/custom/cert.pem"

# Upgrade a cleartext `imap://` connection.
#imap.starttls = false

# Offered during the TLS handshake (rustls only). Defaults to ["imap"], `[]`
# skips ALPN.
#imap.alpn = ["imap"]
#imap.alpn = []

# Pick exactly one SASL mechanism. Omit the whole `sasl` table to skip
# authentication (no `AUTHENTICATE` command sent).

# ANONYMOUS: https://datatracker.ietf.org/doc/html/rfc4505
#imap.sasl.anonymous.message = "neverest"

# PLAIN: https://datatracker.ietf.org/doc/html/rfc4616
imap.sasl.plain.username = "pimalaya@fastmail.org"
imap.sasl.plain.password.command = ["pass", "show", "pimalaya/fastmail-imap-pop-smtp"]
#imap.sasl.plain.password.command = "pass show example"

# LOGIN: https://datatracker.ietf.org/doc/html/draft-murchison-sasl-login-00
#imap.sasl.login.username = "user@example.com"
#imap.sasl.login.password.raw = "***"

# OAUTHBEARER (GS2 host and port derived from the server URL):
# https://datatracker.ietf.org/doc/html/rfc7628
#imap.sasl.oauthbearer.username = "user@example.com"
#imap.sasl.oauthbearer.token.raw = "***"
#imap.sasl.oauthbearer.token.command = ["ortie", "token", "read", "example"]

# XOAUTH2: https://developers.google.com/gmail/imap/xoauth2-protocol
#imap.sasl.xoauth2.username = "user@example.com"
#imap.sasl.xoauth2.token.raw = "***"

# SCRAM-SHA-256: https://datatracker.ietf.org/doc/html/rfc7677
#imap.sasl.scram-sha-256.username = "user@example.com"
#imap.sasl.scram-sha-256.password.raw = "***"

# Keep the server read-mostly, so a buggy sync cannot destroy its state.
imap.collection.create = false
imap.collection.delete = false
imap.item.create = true
imap.item.delete = false

# Narrow the pool when the server's `LIMIT` advertises less than 8.
#imap.pool-size = 8

# --------------------------------------------------------------------------------
# JMAP config (alternative to the IMAP block above)
# https://www.iana.org/go/rfc8620
# https://www.iana.org/go/rfc8621
# --------------------------------------------------------------------------------
#
# NOTE: this block parses, but no JMAP backend is compiled in yet, so a side
# declaring it is refused when the sync opens it.

# Bare authority (discovered through `GET /.well-known/jmap`) or session URL.
#jmap.server = "fastmail.com"
#jmap.server = "https://api.fastmail.com/jmap/session"

# TLS mirrors the imap.tls block above. ALPN defaults to ["http/1.1"].
#jmap.tls.provider = "rustls"
#jmap.tls.rustls.crypto = "ring"
#jmap.tls.cert = "/path/to/custom/cert.pem"
#jmap.alpn = ["http/1.1"]
#jmap.alpn = []

# Pick exactly one of `header`, `bearer`, `basic`.
#jmap.auth.header.raw = "Bearer eyJhbGciOiJ..."
#jmap.auth.header.command = "pass show fastmail-token"
#jmap.auth.bearer.token.raw = "***"
#jmap.auth.bearer.token.command = ["ortie", "access-token", "read", "fastmail-api"]
#jmap.auth.basic.username = "user@example.com"
#jmap.auth.basic.password.raw = "***"
#jmap.auth.basic.password.command = "pass show fastmail"

#jmap.pool-size = 4

# --------------------------------------------------------------------------------
# Gmail config (alternative to the IMAP / JMAP blocks above)
# https://developers.google.com/gmail/api
# --------------------------------------------------------------------------------
#
# NOTE: this block parses, but no Gmail backend is compiled in yet, so a side
# declaring it is refused when the sync opens it.

# Labels are exposed as collections; the API host is fixed, so only the owner,
# TLS and the credential are configurable.
#gmail.user-id = "me"
#gmail.tls.provider = "rustls"
#gmail.tls.rustls.crypto = "ring"
#gmail.tls.cert = "/path/to/custom/cert.pem"
#gmail.alpn = ["http/1.1"]
#gmail.alpn = []

# Bearer tokens only. Refreshing one is the command's job, typically ortie.
#gmail.auth.token.raw = "***"
#gmail.auth.token.command = ["ortie", "access-token", "read", "gmail"]

#gmail.item.create = true
#gmail.item.delete = false
#gmail.pool-size = 4

# --------------------------------------------------------------------------------
# Microsoft Graph config (alternative to the blocks above)
# https://learn.microsoft.com/en-us/graph/api/resources/mail-api-overview
# --------------------------------------------------------------------------------

# Mail folders are exposed as collections; the API host is fixed, so only the
# owner, TLS and the credential are configurable.
#msgraph.user-id = "me"
#msgraph.tls.provider = "rustls"
#msgraph.tls.rustls.crypto = "ring"
#msgraph.tls.cert = "/path/to/custom/cert.pem"
#msgraph.alpn = ["http/1.1"]
#msgraph.alpn = []

# Bearer tokens only: neverest runs no OAuth flow. The command runs once per
# opened connection, typically ortie serving a cached, auto-refreshed token.
#msgraph.auth.token.raw = "***"
#msgraph.auth.token.command = ["ortie", "-a", "msgraph", "token", "show", "--auto-refresh"]

# NOTE: Graph pushes flags and deletes only; appends and moves are rejected
# whatever the permissions say.
#msgraph.item.create = true
#msgraph.item.delete = false
#msgraph.pool-size = 4

# --------------------------------------------------------------------------------
# CardDAV config (contacts, not mail)
# https://www.iana.org/go/rfc6352
# --------------------------------------------------------------------------------

# A CardDAV side syncs **contacts**, so it pairs with another contacts side or
# with the store alone, never with a mailbox: an account's two sides must agree
# on their kind. Requires the `carddav` cargo feature, which is not in the
# default set until the backend has a live suite behind it.
#
# The URL is the entry point only; the principal and the address book home set
# are discovered from it, and each address book becomes a collection keyed by
# its path segment.
#carddav.server = "https://dav.example.org/"

# Pick exactly one of `basic` (the common case) or `bearer`.
#carddav.auth.basic.username = "user"
#carddav.auth.basic.password.command = ["pass", "show", "example/dav"]
#carddav.auth.bearer.token.command = ["ortie", "-a", "dav", "token", "show", "-r"]

# TLS mirrors the imap.tls block above. ALPN defaults to ["http/1.1"].
#carddav.tls.provider = "rustls"
#carddav.alpn = ["http/1.1"]

# Cards are mutable, unlike mail: `item.update` gates in-place edits here, and
# a conditional write means a card edited on both sides is reported as a
# conflict rather than overwritten.
#carddav.item.update = true
#carddav.item.create = true
#carddav.item.delete = false
#carddav.pool-size = 4

# --------------------------------------------------------------------------------
# Store options
# --------------------------------------------------------------------------------

# Where `pimdir.db` and `objects/` live. Defaults to the XDG state directory.
#store.root = "~/.local/state/neverest/example"

# What the store KEEPS is not configured. It is derived per kind from how many
# sources share a namespace, and reported on every run and by `neverest check`:
#
#   one source                            every body (the offline replica)
#   two sharing a namespace, IMAP to IMAP  no body; each crossing is streamed
#   anything else                          the bodies that crossed
#
# Adding a second source to a namespace therefore flips it from keeping every
# body to keeping none. Bodies already stored are NOT deleted by that: they stay,
# unreferenced, until an explicit `pimdir gc` or `neverest sync --reset`.

# The store never truly deletes: an item whose last binding vanishes (a remote
# expunge) is retained instead, hidden but kept with its body. This is how long
# it stays before a sync reclaims it: one integer plus `s`, `m`, `h`, `d` or
# `w`. UNSET means never purge, `"0"` purges at once (the terminal-delete
# behaviour). `neverest sync --no-purge` skips one run. Inspect and restore
# retained items with the `pimdir` CLI.
#store.purge-after = "90d"

# BACKUP RECIPE: a read-only source plus no purge, so a remote expunge cannot
# lose anything. The expunge still propagates, but the item stays in the store,
# restorable, until you purge on purpose:
#
#   imap.item.delete = false
#   imap.collection.delete = false
#   # store.purge-after left unset

# --------------------------------------------------------------------------------
# Submission send channel (SMTP)
# --------------------------------------------------------------------------------

# The server a source's queued `submit` intents are sent through at the start of
# every sync. A frontend enqueues one through the store's action queue (a
# `v: 1` payload naming the body blob plus the envelope); there is no reserved
# Outbox collection. The channel belongs to the source it completes: a source
# either sends by itself (Graph, through sendMail) or needs this. AT MOST ONE
# source per account may declare it; two is refused at load.
#
# An SMTP 4xx leaves the intent pending for the next run, a 5xx parks it.
# Sending is at-least-once, so `Message-ID` deduplication is the provider's job.
#
# Omit `login` and `password` together for an unauthenticated relay.
#smtp.server = "smtps://smtp.fastmail.com:465"
#smtp.server = "smtp://smtp.example.com:587"
#smtp.starttls = true
#smtp.login = "pimalaya@fastmail.org"
#smtp.password.command = ["pass", "show", "pimalaya/fastmail-imap-pop-smtp"]

# Offered during the TLS handshake (rustls only). Defaults to ["smtp"], `[]`
# skips ALPN.
#smtp.alpn = ["smtp"]
#smtp.alpn = []

# --------------------------------------------------------------------------------
# Named sources (the explicit form)
# --------------------------------------------------------------------------------
#
# Everything above is the sugar: `imap.server` is `sources.imap.imap.server`, the
# source taking its protocol as its name. The two spellings are the same
# configuration, source id included, so expanding one by hand changes nothing in
# the store.
#
# Reach for the explicit table when you need two sources of one protocol, which
# the sugar cannot express. The map key is the source name, and the source name
# is the pimdir source id every binding it owns is recorded under: RENAMING ONE
# ORPHANS THEM, so pick a name you can live with.
#
# MIRROR (the old `left` / `right` pair): two sources sharing a namespace bind
# the same hub collections, so an item on one is pushed to the other. On an IMAP
# to IMAP pairing the store keeps no body and streams each crossing through.
#
#   [accounts.migrate]
#   sources.old.imap.server = "imap.old-provider.com"
#   sources.old.imap.sasl.plain.username = "user@old-provider.com"
#   sources.old.imap.sasl.plain.password.command = "pass show old"
#   sources.old.imap.collection.namespace = "mail"
#   sources.new.imap.server = "imap.new-provider.com"
#   sources.new.imap.sasl.plain.username = "user@new-provider.com"
#   sources.new.imap.sasl.plain.password.command = "pass show new"
#   sources.new.imap.collection.namespace = "mail"
#
# SIDE BY SIDE: leave the namespaces alone and the same two sources cache into
# one store without ever writing to each other, for a frontend to union at
# display time. This is the default, so it is what you get by saying nothing.
#
#   [accounts.personal]
#   sources.fastmail.imap.server = "imap.fastmail.com"
#   sources.fastmail.imap.sasl.plain.username = "user@fastmail.com"
#   sources.fastmail.imap.sasl.plain.password.command = "pass show fastmail"
#   sources.gmail.imap.server = "imap.gmail.com"
#   sources.gmail.imap.sasl.xoauth2.username = "user@gmail.com"
#   sources.gmail.imap.sasl.xoauth2.token.command = ["ortie", "token", "read", "gmail"]
#
# A namespace of three or more sources is refused: the pairwise relay has no
# meaning there, and it is not implemented.
#
# `neverest sync --source <name>` narrows a run to the namespaces holding that
# source. It picks namespaces rather than sources, because running half a mirror
# would push one way and call it done.
