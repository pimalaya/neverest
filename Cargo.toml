[package]
name = "neverest"
description = "CLI to synchronize PIM collections: mail, contact, calendar…"
version = "0.3.0"
authors = ["Clément DOUIN (soywod) <clement.douin@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "email"]
keywords = ["cli", "email", "contacts", "imap", "sync"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/neverest"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls-ring", "imap", "smtp", "dav", "msgraph", "gpeople", "gcal", "gmail", "vendored", "wizard"]
native-tls = ["pimalaya-stream/native-tls", "io-pim-discovery?/native-tls", "io-webdav?/native-tls", "io-imap?/native-tls", "io-msgraph?/native-tls", "io-smtp?/native-tls", "io-gpeople?/native-tls", "io-gcal?/native-tls", "io-gmail?/native-tls"]
rustls-aws = ["pimalaya-stream/rustls-aws", "io-pim-discovery?/rustls-aws", "io-webdav?/rustls-aws", "io-imap?/rustls-aws", "io-msgraph?/rustls-aws", "io-smtp?/rustls-aws", "io-gpeople?/rustls-aws", "io-gcal?/rustls-aws", "io-gmail?/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-pim-discovery?/rustls-ring", "io-webdav?/rustls-ring", "io-imap?/rustls-ring", "io-msgraph?/rustls-ring", "io-smtp?/rustls-ring", "io-gpeople?/rustls-ring", "io-gcal?/rustls-ring", "io-gmail?/rustls-ring"]
imap = ["dep:io-imap", "io-imap/client", "io-imap/scram"]
smtp = ["dep:io-smtp", "io-smtp/client", "io-smtp/scram"]
dav = ["dep:io-webdav", "dep:io-http", "dep:ical-rs", "dep:vcard-rs", "io-pim-discovery?/rfc6764"]
msgraph = ["dep:io-msgraph", "dep:ical-rs", "dep:jiff", "dep:vcard-rs", "io-msgraph/client", "io-msgraph/ical", "io-msgraph/vcard"]
gpeople = ["dep:io-gpeople", "dep:ical-rs", "dep:vcard-rs", "io-gpeople/client", "io-gpeople/vcard"]
gcal = ["dep:io-gcal", "dep:ical-rs", "dep:vcard-rs", "io-gcal/client", "io-gcal/ical"]
gmail = ["dep:io-gmail", "io-gmail/client"]
vendored = ["io-pimdir/vendored", "pimalaya-config/vendored", "pimalaya-stream/vendored", "io-webdav?/vendored", "io-imap?/vendored", "io-msgraph?/vendored", "io-smtp?/vendored", "io-gpeople?/vendored", "io-gcal?/vendored", "io-gmail?/vendored"]
wizard = ["dep:io-pim-discovery", "pimalaya-cli/prompt", "pimalaya-cli/wizard", "pimalaya-cli/imap", "pimalaya-cli/smtp"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pimalaya-cli = { version = "0.2", default-features = false, features = ["build"] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
crossbeam-queue = "0.3"
crossterm = { version = "0.29", default-features = false, features = ["serde"] }
dirs = "7"
ical-rs = { version = "0.5.3", optional = true }
io-gcal = { version = "0.1.3", default-features = false, optional = true }
io-gmail = { version = "0.4", default-features = false, optional = true }
io-gpeople = { version = "0.4.2", default-features = false, optional = true }
io-http = { version = "0.5", default-features = false, optional = true }
io-imap = { version = "0.7", default-features = false, optional = true }
io-msgraph = { version = "0.4.5", default-features = false, optional = true }
io-pim-discovery = { version = "0.8", default-features = false, features = ["pacc", "autoconfig", "rfc6186", "stream"], optional = true }
io-pimdir = { version = "0.6", default-features = false, features = ["client"] }
io-sasl = { version = "0.1", default-features = false, features = ["saslprep", "scram"] }
jiff = { version = "0.2", default-features = false, features = ["std"], optional = true }
io-smtp = { version = "0.5", default-features = false, optional = true }
io-webdav = { version = "0.5", default-features = false, optional = true }
log = "0.4"
mail-parser = { version = "0.11", features = ["serde"] }
percent-encoding = "2"
pimalaya-cli = { version = "0.2", default-features = false, features = ["terminal", "spinner"] }
pimalaya-config = { version = "0.2", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.3", default-features = false }
rfc2047-decoder = "1"
schemars = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3.1"
tempfile = "3"
toml = "1.1"
url = { version = "2.2", features = ["serde"] }
vcard-rs = { version = "0.5", optional = true }

[dev-dependencies]
io-oauth = { version = "0.3", default-features = false, features = ["jwt-bearer", "rustls-ring"] }
