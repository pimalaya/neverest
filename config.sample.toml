[accounts.example]
#one-way = false			# the sources win and the other side's changes are discarded, never merged
#retain = true				# the store keeps bodies, unset true with no target and false with targets
#mail.filter.since = "30d"		# the oldest mail listed: a duration, a date or an RFC 3339 instant
#connections = 4			# connections per source for body downloads, sync -j overriding it

#contact.merger = "tcard merge {base} {local} {remote} --output {output}"	# what conflict resolve --interactive runs on a card
#calendar.merger = "tcal merge {base} {local} {remote} --output {output}"	# and on an event

#store.root = "~/.local/state/neverest"	# the store, shared by every account naming the same root
#store.purge-after = "90d"		# when a retained item is reclaimed, unset never and 0 at once
#store.index-timeout = "60s"		# the longest a sync refreshes the search index, 0 never

#proxy.url = "socks5h://localhost:1080"	# a socks5, socks5h or http proxy for every endpoint
#proxy.username = "alice"		# its username
#proxy.password.command = "exit 127"	# prints its password

# IMAP
#imap.server = "imap.example.org"	# implicit TLS on 993; imap://host is cleartext on 143
#imap.starttls = false			# upgrade an imap:// connection with STARTTLS
#imap.sasl-ir = false			# inline the credentials, unset following SASL-IR, false for Coremail
#imap.id.auto = false			# send ID once signed in, as QQ Mail and Fastmail want
#imap.id.fields.name = true		# what ID sends: true neverest's value, false NIL

#imap.sasl.plain.username = "alice@example.org"	# PLAIN; login and scram-sha-256 take the same keys
#imap.sasl.plain.password.command = "exit 127"	# prints the password
#imap.sasl.plain.password.raw = "secret"	# the password itself

#imap.sasl.xoauth2.username = "alice@example.org"	# XOAUTH2; oauthbearer takes the same keys
#imap.sasl.xoauth2.token.command = "exit 127"		# prints an OAuth 2.0 access token

# Sync, the same keys under every backend table and msgraph domain
#imap.collection.filter.include = ["INBOX", "Sent"]	# the collections synced, exclude = [...] the ones skipped, all otherwise
#imap.collection.create = true				# a collection created on one side is created here
#imap.collection.delete = false				# a collection gone on one side is deleted here
#imap.collection.rename = true				# a frontend may rename a collection, unset false when one-way
#imap.collection.capped = false				# the server lists at most a number of items, so what it leaves out is kept
#imap.flag.update = true				# flag changes are pushed here
#imap.item.create = true				# items are created here, with item.delete
#imap.item.delete = false				# items are deleted here, with item.create
#imap.item.update = true				# an item's body is edited in place, cards and events only

# Network, the same keys under smtp, jmap, gmail, msgraph, gpeople, gcal, carddav and caldav
#imap.tls.provider = "rustls"				# the build's first otherwise [native-tls]
#imap.tls.rustls.crypto = "ring"			# the build's first otherwise [aws]
#imap.tls.cert = "/path/to/cert.pem"			# a PEM certificate to trust
#imap.tls.client.cert = "/path/to/client.pem"		# a PEM client certificate, for mutual TLS
#imap.tls.client.key = "/path/to/client.key.pem"	# its PEM private key, PKCS#8 under native-tls
#imap.alpn = ["imap"]					# the ALPN ids rustls offers, empty for none
#imap.proxy.url = "socks5h://localhost:1080"		# the proxy keys, for IMAP alone

# SMTP, the send channel of queued messages, one per account
#smtp.server = "smtp.example.org"		# implicit TLS on 465; smtp://host is cleartext on 25
#smtp.starttls = false				# upgrade an smtp:// connection with STARTTLS
#smtp.sasl.plain.username = "alice@example.org"	# as imap.sasl
#smtp.sasl.plain.password.command = "exit 127"	# prints the password

# JMAP, parsed but not built yet
#jmap.server = "https://api.fastmail.com/jmap/session"	# the session URL, or a host serving /.well-known/jmap

#jmap.auth.bearer.token.command = "exit 127"	# prints a bearer token

#jmap.auth.basic.username = "alice@example.org"	# HTTP Basic
#jmap.auth.basic.password.command = "exit 127"	# prints the password

# Gmail
#gmail.user-id = "me"			# the mailbox owner [alice@example.org]
#gmail.auth.token.command = "exit 127"	# prints an OAuth 2.0 access token, scope https://mail.google.com/
#gmail.batch-size = 10			# reads per batch request, 1 to 100
#gmail.batches-in-flight = 1		# batches at once across the source's connections
#gmail.units-per-minute = 6000		# the quota units spent over any 60 seconds

# Microsoft Graph, one session for its domains, each a source
#msgraph.user-id = "me"				# the mailbox owner [bob@example.org]
#msgraph.auth.token.command = "exit 127"	# prints an OAuth 2.0 access token with each domain's scope
#msgraph.mail = true				# the mail folders, or a table of the sync keys and pool-size
#msgraph.contact = true				# the contact folders, scope Contacts.ReadWrite
#msgraph.calendar = true			# the calendars, scope Calendars.ReadWrite

# Google People and Google Calendar
#gpeople.auth.token.command = "exit 127"	# prints an OAuth 2.0 access token, scope contacts
#gcal.auth.token.command = "exit 127"		# prints an OAuth 2.0 access token, scope calendar

# CardDAV
#carddav.server = "dav.example.org"			# implicit https; the principal and home set are discovered
#carddav.home = "https://dav.example.org/cards/"	# the home set itself, nothing discovered

#carddav.auth.basic.username = "alice"			# HTTP Basic, no `auth` at all for an anonymous server
#carddav.auth.basic.password.command = "exit 127"	# prints the password

#carddav.auth.bearer.token.command = "exit 127"	# prints a bearer token

# CalDAV
#caldav.server = "dav.example.org"			# implicit https; the principal and home set are discovered
#caldav.home = "https://dav.example.org/calendars/"	# the home set itself, nothing discovered

#caldav.auth.basic.username = "alice"			# HTTP Basic
#caldav.auth.basic.password.command = "exit 127"	# prints the password

#caldav.auth.bearer.token.command = "exit 127"	# prints a bearer token

# Named sources and targets. Each backend table above is shorthand for a
# source named after it: imap.* means sources.imap.imap.*, and msgraph.* the
# sources msgraph-mail, msgraph-contact and msgraph-calendar. A name keys what
# the store holds, so renaming a source orphans what it synced.

# Two endpoints of one protocol: name each source
#sources.work.imap.server = "imap.work.example.org"	# the imap keys above, for a source named work
#sources.work.smtp.server = "smtp.work.example.org"	# its send channel, the smtp keys above

# A remote syncing with the source instead of the store: a mirror, or a backup
# with one-way
#targets.backup.imap.server = "imap.backup.example.org"	# a target named backup, the same keys
