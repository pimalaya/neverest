[package]
name = "neverest"
description = "CLI to synchronize PIM collections: mail, contact, calendar…"
version = "0.3.0"
authors = ["Clément DOUIN (soywod) <clement.douin@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "email"]
keywords = ["cli", "email", "contacts", "imap", "sync"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/neverest"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls-ring", "imap", "smtp", "carddav", "caldav", "msgraph", "gpeople", "gcal", "gmail", "vendored", "search"]
native-tls = ["pimalaya-stream/native-tls", "io-webdav?/native-tls", "io-imap?/native-tls", "io-msgraph?/native-tls", "io-smtp?/native-tls", "io-gpeople?/native-tls", "io-gcal?/native-tls", "io-gmail?/native-tls"]
rustls-aws = ["pimalaya-stream/rustls-aws", "io-webdav?/rustls-aws", "io-imap?/rustls-aws", "io-msgraph?/rustls-aws", "io-smtp?/rustls-aws", "io-gpeople?/rustls-aws", "io-gcal?/rustls-aws", "io-gmail?/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-webdav?/rustls-ring", "io-imap?/rustls-ring", "io-msgraph?/rustls-ring", "io-smtp?/rustls-ring", "io-gpeople?/rustls-ring", "io-gcal?/rustls-ring", "io-gmail?/rustls-ring"]
imap = ["dep:io-imap", "io-imap/client", "io-imap/scram"]
smtp = ["dep:io-smtp", "io-smtp/client", "io-smtp/scram"]
carddav = ["dep:io-webdav", "dep:io-http", "dep:ical-rs", "dep:vcard-rs"]
caldav = ["dep:io-webdav", "dep:io-http", "dep:ical-rs", "dep:vcard-rs"]
msgraph = ["dep:io-msgraph", "dep:base64", "dep:ical-rs", "dep:jiff", "jiff/tz-system", "dep:vcard-rs", "io-msgraph/client", "io-msgraph/ical", "io-msgraph/vcard"]
gpeople = ["dep:io-gpeople", "dep:ical-rs", "dep:vcard-rs", "io-gpeople/client", "io-gpeople/vcard"]
gcal = ["dep:io-gcal", "dep:ical-rs", "dep:jiff", "jiff/tz-system", "dep:vcard-rs", "io-gcal/client", "io-gcal/ical"]
gmail = ["dep:io-gmail", "io-gmail/client"]
vendored = ["io-pimdir/vendored", "pimalaya-config/vendored", "pimalaya-stream/vendored", "io-webdav?/vendored", "io-imap?/vendored", "io-msgraph?/vendored", "io-smtp?/vendored", "io-gpeople?/vendored", "io-gcal?/vendored", "io-gmail?/vendored"]
search = ["io-pimdir/search", "dep:jiff", "jiff/tz-system"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pimalaya-cli = { version = "0.6.0", default-features = false, features = ["build"] }

[dev-dependencies]
io-oauth = { version = "0.7", default-features = false, features = ["jwt-bearer", "rustls-ring"] }

[dependencies]
anyhow = "1"
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
crossbeam-queue = "0.3"
dirs = "7"
ical-rs = { version = "0.7.1", optional = true }
io-gcal = { version = "0.5.2", default-features = false, optional = true }
io-gmail = { version = "0.9", default-features = false, optional = true }
io-gpeople = { version = "0.8.1", default-features = false, optional = true }
io-http = { version = "0.8", default-features = false, optional = true }
io-imap = { version = "0.11.2", default-features = false, optional = true }
io-msgraph = { version = "0.9.3", default-features = false, optional = true }
io-pimdir = { version = "0.15.1", default-features = false, features = ["client"] }
io-sasl = { version = "0.2", default-features = false, features = ["scram"] }
io-smtp = { version = "0.9", default-features = false, optional = true }
io-webdav = { version = "0.11.0", default-features = false, optional = true }
jiff = { version = "1", default-features = false, features = ["std"], optional = true }
log = "0.4"
percent-encoding = "2"
pimalaya-cli = { version = "0.6.0", default-features = false, features = ["terminal", "signal"] }
pimalaya-config = { version = "0.5.2", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.4", default-features = false }
rusqlite = { version = "0.43", default-features = false }
schemars = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"
url = { version = "2.2", features = ["serde"] }
vcard-rs = { version = "0.6", optional = true }
